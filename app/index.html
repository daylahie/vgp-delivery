<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giao VGP</title>
<meta name="description" content="Lộ trình giao hàng ngắn nhất trong Vinhomes Grand Park – chạy offline">
<meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giao VGP">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#faf6f2;--card:#ffffff;--fg:#2b2326;--mut:#8a7f82;--line:#ece3de;--soft:#f6eeea;
  --acc:#b85c6e;--acc-soft:#f7e6e9;--acc-fg:#fff;--plum:#5e3a48;--bad:#c0392b;
  --map-bg:#f3eee9;--map-road:#ffffff;--map-road-edge:#e3d9d2;--map-major:#f6e5cc;--map-walk:#cfe0cc;
  --map-bld:#e8e0da;--map-bld-edge:#d9cec7;--map-lbl:#6d6265;--map-bnd:#e2b9a4;--route:#b85c6e;--route-done:#c9bfc2;--depot:#5e3a48;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161213;--card:#221c1e;--fg:#f4eef0;--mut:#a3979a;--line:#342b2e;--soft:#2b2326;
  --acc:#e08a9b;--acc-soft:#3a2a2f;--acc-fg:#1f1416;--plum:#d7b2c0;
  --map-bg:#1c1718;--map-road:#3a3134;--map-road-edge:#2a2224;--map-major:#5a4632;--map-walk:#33463a;
  --map-bld:#2c2427;--map-bld-edge:#3a3033;--map-lbl:#c9bcc0;--map-bnd:#7a5546;--route:#e08a9b;--route-done:#5b4d52;--depot:#d7b2c0;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.screen{display:none;padding:18px 18px 28px}.screen.on{display:block}
h1{font-size:28px;font-weight:700;letter-spacing:-.4px;margin:6px 2px 16px}
.mut{color:var(--mut)}
.small{font-size:14px}

/* thanh tab */
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;padding:10px 0 8px;font-size:12px;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:25px;height:25px}
nav button.on{color:var(--acc)}
nav .dot{position:absolute;top:7px;left:calc(50% + 9px);min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-fg);font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
nav .dot.on{display:flex}

/* nút */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border-radius:var(--r);
  background:var(--acc);color:var(--acc-fg);font-size:19px;font-weight:600;letter-spacing:.1px}
.btn:disabled{opacity:.35}
.btn.ghost{background:var(--acc-soft);color:var(--acc)}
.link{color:var(--acc);font-weight:600;font-size:16px;padding:10px 4px}
.link.mut{color:var(--mut);font-weight:500}
.links{display:flex;justify-content:center;gap:28px;margin:6px 0 4px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;font-size:16px;color:var(--mut);min-height:42px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px #0000001a}
input[type=search],input[type=number],input[type=text]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
input:focus{border-color:var(--acc)}
.card{background:var(--card);border-radius:var(--r);padding:4px 16px;margin-bottom:14px}

/* chọn tòa */
.bar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px;min-height:28px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:15px}
.zone{background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.zone-h{display:flex;align-items:center;gap:10px;padding:16px;font-weight:600;font-size:17px}
.zone-h .cnt{margin-left:auto;font-size:15px;font-weight:500;color:var(--mut)}
.zone-h .cnt.has{color:var(--acc);font-weight:700}
.zone-h .car{width:9px;height:9px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .15s}
.zone.closed .car{transform:rotate(-45deg);margin-bottom:0}
.zone.closed .items{display:none}
.zone .all{display:block;width:100%;text-align:left;padding:12px 16px;color:var(--acc);font-weight:600;font-size:15px;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px}
.item .id{font-weight:600;font-size:18px}
.item .nm{font-size:13px;color:var(--mut)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;transition:all .12s}
.item.on .ck{background:var(--acc);border-color:var(--acc)}
.item.on .ck:after{content:"";width:6px;height:12px;border:solid var(--acc-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dock{position:sticky;bottom:0;padding:18px 0 2px;background:linear-gradient(transparent,var(--bg) 30%)}

/* bản đồ thu nhỏ */
.mapcard{position:relative;height:38vh;min-height:230px;border-radius:var(--r);overflow:hidden;margin:14px 0;background:var(--map-bg)}
.mapcard canvas{width:100%;height:100%;display:block}
.mapcard .hint{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:19px;background:var(--card);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px #0002;pointer-events:none}
.mapcard .hint svg{width:18px;height:18px;color:var(--fg)}
/* bản đồ toàn màn hình */
#full{position:fixed;inset:0;z-index:40;background:var(--map-bg);display:none;touch-action:none}
#full.on{display:block}
#full canvas{width:100%;height:100%;display:block}
#full .close{position:absolute;top:calc(14px + var(--safe-t));right:14px;width:46px;height:46px;border-radius:23px;background:var(--card);
  box-shadow:0 2px 10px #0003;display:flex;align-items:center;justify-content:center}
#full .close svg{width:20px;height:20px}

/* lộ trình */
.sum{display:flex;align-items:baseline;gap:8px;margin:2px 2px 14px;flex-wrap:wrap}
.sum b{font-size:30px;font-weight:700;letter-spacing:-.5px}
.sum span{color:var(--mut);font-size:16px}
.stop{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:none}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.num.home{background:var(--plum);color:var(--card)}
.num.home svg{width:15px;height:15px}
.num.done{background:var(--soft);color:var(--mut)}
.stop .id{font-weight:600;font-size:17px}
.stop .z{font-size:13px;color:var(--mut)}
.stop .leg{margin-left:auto;color:var(--mut);font-size:14px;white-space:nowrap}
.stop.done .id{color:var(--mut);text-decoration:line-through}
.stop.cur{background:var(--acc-soft);margin:0 -16px;padding:12px 16px}

/* đang giao */
.prog{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.prog .track{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .25s}
.prog b{font-size:16px}
.next{background:var(--card);border-radius:22px;padding:24px 18px 22px;text-align:center;margin-bottom:14px}
.next .lbl{font-size:15px;color:var(--mut)}
.next .big{font-size:64px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 8px;color:var(--fg)}
.next .sub{font-size:16px;color:var(--mut)}
.next .note{margin-top:12px;font-size:15px;background:var(--acc-soft);border-radius:12px;padding:10px 12px;color:var(--fg)}

.empty{text-align:center;padding:70px 24px;color:var(--mut)}
.empty svg{width:56px;height:56px;color:var(--line);margin-bottom:12px}
.empty b{display:block;color:var(--fg);font-size:19px;margin-bottom:6px}

/* cài đặt */
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:none}
.set label{flex:1}
.set input{width:96px;text-align:right;padding:10px 12px}
.sec{font-size:14px;color:var(--mut);margin:20px 4px 8px;font-weight:500}
details.card{padding:0 16px}
details summary{list-style:none;padding:16px 0;font-weight:600;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"";width:8px;height:8px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(-45deg);margin-left:auto;transition:transform .15s}
details[open] summary:after{transform:rotate(45deg)}
.row{display:flex;gap:10px}
.plain{padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left;color:var(--acc);font-weight:500}
.plain.bad{color:var(--bad)}

/* hộp thoại, thông báo */
#modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + var(--safe-b))}
#modal h3{margin:0 0 8px;font-size:20px}
#modal p{margin:0 0 18px}
#modal .btn+.btn{margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));background:var(--fg);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
#toast.on{opacity:.94}
#update{display:none;background:var(--acc);color:var(--acc-fg);padding:11px 16px;font-size:15px;text-align:center;font-weight:500}
#update.on{display:block}
@media (min-width:760px){main{max-width:640px;margin:0 auto;width:100%}}
</style>
</head>
<body>
<div id="app">
  <div id="update"></div>
  <main>
    <!-- CHỌN TÒA -->
    <section class="screen on" id="s-pick">
      <h1>Chọn tòa</h1>
      <input type="search" id="q" placeholder="Tìm tòa, vd. S3.03" autocomplete="off" autocorrect="off" autocapitalize="characters">
      <div class="bar">
        <span class="mut" id="selInfo">Chưa chọn tòa nào</span>
        <button class="link" id="bClear" style="padding:4px">Bỏ chọn</button>
      </div>
      <div class="chips" id="presets"></div>
      <div id="zones"></div>
      <div class="dock"><button class="btn" id="bSolve" disabled>Tính lộ trình</button></div>
    </section>

    <!-- GIAO HÀNG -->
    <section class="screen" id="s-go">
      <div id="goEmpty" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>
        <b>Chưa có lộ trình</b>Chọn tòa cần giao rồi bấm “Tính lộ trình”.
      </div>

      <!-- xem trước lộ trình -->
      <div id="plan" style="display:none">
        <h1>Lộ trình</h1>
        <div class="seg" id="modeSeg"><button data-m="moto">Xe máy</button><button data-m="walk">Đi bộ</button></div>
        <div class="sum" style="margin-top:16px"><b id="pDist"></b><span id="pMeta"></span></div>
        <button class="btn" id="bStart">Bắt đầu giao</button>
        <div class="mapcard" id="mapPlan"></div>
        <div class="card" id="planList"></div>
      </div>

      <!-- đang giao -->
      <div id="trip" style="display:none">
        <div class="prog"><div class="track"><i id="tBar"></i></div><b id="tProg"></b></div>
        <div class="next" id="tNext"></div>
        <button class="btn" id="bDone"></button>
        <div class="links"><button class="link mut" id="bUndo">Hoàn tác</button><button class="link mut" id="bReplan">Tính lại đường</button></div>
        <div class="mapcard" id="mapTrip"></div>
        <div class="card" id="tripList"></div>
        <div class="links"><button class="link mut" id="bEnd">Kết thúc chuyến</button></div>
      </div>
    </section>

    <!-- CÀI ĐẶT -->
    <section class="screen" id="s-set">
      <h1>Cài đặt</h1>
      <div class="card">
        <div class="set"><label for="spMoto">Tốc độ xe máy <span class="mut small">km/h</span></label><input type="number" id="spMoto" min="3" max="60" step="1" inputmode="decimal"></div>
        <div class="set"><label for="spWalk">Tốc độ đi bộ <span class="mut small">km/h</span></label><input type="number" id="spWalk" min="1" max="10" step="0.5" inputmode="decimal"></div>
        <div class="set"><label for="stopMin">Dừng mỗi sảnh <span class="mut small">phút</span></label><input type="number" id="stopMin" min="0" max="30" step="0.5" inputmode="decimal"></div>
      </div>
      <div class="sec">Nhóm tòa đã lưu</div>
      <div class="card" id="presetList"></div>
      <details class="card">
        <summary>Nâng cao</summary>
        <button class="plain" id="bExport">Sao lưu nhóm tòa ra file</button>
        <button class="plain" id="bImport">Khôi phục từ file</button>
        <input type="file" id="fImport" accept=".json,application/json" hidden>
        <button class="plain" id="bBench">Đo tốc độ tính</button>
        <div class="mut small" id="benchOut"></div>
        <div class="sec" style="margin-left:0">Chuyến gần đây</div>
        <div id="history" class="mut small"></div>
        <div class="mut small" id="dataInfo" style="padding:14px 0;border-top:1px solid var(--line);margin-top:10px"></div>
        <button class="plain bad" id="bReset">Xoá dữ liệu trên máy</button>
      </details>
    </section>
  </main>

  <nav>
    <button data-s="s-pick" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg>Chọn tòa</button>
    <button data-s="s-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>Giao hàng<span class="dot" id="tripDot"></span></button>
    <button data-s="s-set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Cài đặt</button>
  </nav>
</div>
<div id="full"><button class="close" id="fullClose" aria-label="Đóng bản đồ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="solver.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
